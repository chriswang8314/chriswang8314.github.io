  <!-- Which painting to show first: the link's ?scene=, else this visitor's
       last pick, else the wheat field; and whether to start from its day or
       night still. Its still and its module start downloading straight away. -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search), ok = /^[a-z0-9-]+$/, id = q.get('scene'), saved = null, nocturne = null;
      try { saved = localStorage.getItem('cw-scene'); nocturne = localStorage.getItem('cw-nocturne'); } catch (e) {}
      if (!ok.test(id || '')) id = ok.test(saved || '') ? saved : 'wheat';
      var h = parseFloat(q.get('hour')), now = new Date().getHours(), night;
      if (!isNaN(h)) night = h >= 20.5 || h < 5.6;
      else if (q.get('mode')) night = q.get('mode') === 'night';
      else if (nocturne) night = nocturne === 'on';
      else night = matchMedia('(prefers-color-scheme: dark)').matches || now >= 21 || now < 6;
      var base = 'scenes/stills/' + id + '-' + (night ? 'night' : 'day');
      window.firstStill = { src: base + '.webp', srcset: base + '-960.webp 960w, ' + base + '.webp 1600w' };
      document.documentElement.dataset.scene = id;
      var still = document.createElement('link');
      still.rel = 'preload';
      still.as = 'image';
      still.href = firstStill.src;
      still.setAttribute('imagesrcset', firstStill.srcset);
      still.setAttribute('imagesizes', '100vw');
      still.setAttribute('fetchpriority', 'high');
      var mod = document.createElement('link');
      mod.rel = 'modulepreload';
      mod.href = 'scenes/' + id + '.js';
      document.head.append(still, mod);
    })();
  </script>
