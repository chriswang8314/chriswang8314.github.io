<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <nav class="site-nav" id="site-nav" aria-label="Main">
    <a class="nav-name" href="#top" data-content="name"></a>

  <header class="hero" id="top">
    <img class="hero-still" src="hero.webp" srcset="hero-960.webp 960w, hero.webp 1600w" sizes="100vw" alt="" width="1600" height="1215" fetchpriority="high">
    <canvas id="scene" aria-hidden="true"></canvas>
    <p class="visually-hidden" data-content="sceneDescription"></p>

    <div class="hero-text" id="hero-text">
      <p class="hello">Hi, I'm</p>
      <h1 class="hero-name" data-content="name"></h1>
      <p class="hero-tagline" id="hero-tagline"></p>
      <ul class="hero-links" id="hero-links"></ul>
    </div>

    <div class="time-control" id="time-control" role="group" aria-label="Time of day">
      <button type="button" class="time-toggle" id="time-toggle" aria-expanded="false" aria-controls="time-panel" aria-label="Change the time of day">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
      <div class="time-panel" id="time-panel">
        <input id="time-slider" type="range" min="0" max="23.99" step="0.05" aria-label="Time of day in the painting">
        <span id="time-label" class="time-label"></span>
        <button id="time-now" class="time-now" type="button" title="Back to the real time" hidden>now</button>
      </div>
    </div>

    <p id="hint" class="hint" aria-hidden="true"></p>

    <a class="scroll-cue" href="#currently" aria-label="Scroll to content">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
    </a>

  <main id="main">
    <section class="section" id="currently" aria-labelledby="currently-title">
      <h2 id="currently-title">Currently…</h2>
      <ul class="currently" id="currently-list"></ul>

    <section class="section" id="projects" aria-labelledby="projects-title">

    <section class="section" id="about" aria-labelledby="about-title">
      <h2 id="about-title">About</h2>
      <div class="prose" id="about-text"></div>
    </section>

    <section class="section" id="contact" aria-labelledby="contact-title">
      <h2 id="contact-title">Contact</h2>

      <ul class="contact-links" id="contact-links"></ul>
      <noscript><p class="prose">chriswang8314 at gmail dot com</p></noscript>
